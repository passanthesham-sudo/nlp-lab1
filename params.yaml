preprocessing:
  lowercase: true
  remove_html: true
  remove_urls: true
  remove_punctuation: true
  remove_numbers: false
  remove_stopwords: true
  stemming: false
  lemmatization: true
  min_token_length: 2

training:
  amazon:
    test_size: 0.2
    random_state: 42
    max_features: 50000
    sample_size: 50000
  sentiment140:
    test_size: 0.2
    random_state: 42
    max_features: 50000
    sample_size: 100000

model:
  logistic_regression:
    C: 1.0
    max_iter: 1000
  linear_svc:
    C: 1.0
    max_iter: 2000

search:
  bm25:
    k1: 1.5
    b: 0.75
  top_k: 10

embeddings:
  vector_size: 100
  window: 5
  min_count: 5
  epochs: 5
  workers: 4
